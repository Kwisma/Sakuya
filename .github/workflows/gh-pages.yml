name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      # The branch where the project source code resides
      # 项目源代码所在的分支
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [lts/*]
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v3
      - name: Checkout the other repository
        uses: actions/checkout@v3
        with:
          repository: Kwisma/cf-worker-mihomo  # 替换为目标仓库的所有者和名称
          ref: main  # 目标仓库的分支
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用默认的 GitHub token
          path: other-repo

      - name: Copy directory from the other repository
        run: |
          mkdir -p public/rules public/icon
          cp -r other-repo/rules/* public/rules
          cp -r other-repo/icon/* public/icon

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org/

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌌 Build Valaxy Blog
        run: npm run build

      - name: 📦 install wrangler
        run: npm install -g wrangler

      - name: 🚀 Deploy to Cloudflare Pages
        run: npx wrangler deploy --name blog --compatibility-date 2025-01-08 --assets=./dist
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
